name:                incremental-computations
version:             0.1.0.0
github:              "skogsbaer/incremental-computations"
license:             BSD3
author:              "medilyse GmbH, Freiburg, Germany (https://medilyse.org)"
maintainer:          "Stefan Wehr"
copyright:           "2010-2023 medilyse GmbH"

extra-source-files:
  - README.md
  - CHANGELOG.md

synopsis:            A framework for incremental computations
category:            Control
description:         Please see the README on GitHub at <https://github.com/githubuser/incremental-computations>

dependencies:
  - aeson
  - async
  - base >= 4.7 && < 5
  - base16-bytestring
  - bytestring
  - cereal
  - cereal-text
  - direct-sqlite
  - containers
  - directory
  - exceptions
  - extra
  - filepath
  - ghc-prim
  - hashable
  - hslogger
  - large-hashable
  - megaparsec
  - monad-control
  - mtl
  - primitive
  - psqueues
  - random
  - resourcet
  - safe
  - stm
  - strict
  - strict-list
  - temporary
  - text
  - time
  - transformers-base
  - unix
  - unordered-containers
  - vector

ghc-options:
  - -O2
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wno-name-shadowing
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Wno-x-partial
  - -Werror

default-extensions:
  - BangPatterns
  - DeriveDataTypeable
  - DeriveFoldable
  - DeriveFunctor
  - DeriveGeneric
  - DeriveTraversable
  - DerivingStrategies
  - DoAndIfThenElse
  - EmptyDataDecls
  - FlexibleContexts
  - GADTs
  - GeneralizedNewtypeDeriving
  - LambdaCase
  - OverloadedStrings
  - ScopedTypeVariables
  - StandaloneDeriving
  - StrictData
  - TypeApplications
  - TypeOperators
  - ViewPatterns

library:
  source-dirs: src
  dependencies:
    - QuickCheck
    # ^ Not test-only: a handful of library types (TimeSpan, DataSize,
    # MultiMap, PriorityAgingQueue and its satellite types) carry an
    # `Arbitrary` instance defined alongside the type itself rather than in
    # a test module. TimeSpan's is exercised by test/TimeSpanTest.hs's
    # prop_timeSpanP; DataSize/MultiMap/PriorityAgingQueue's are not used by
    # any test in this repo -- they look like downstream convenience
    # instances (so a library consumer can `arbitrary` these types in their
    # own QuickCheck properties without writing the instance themselves).
    # Flagged rather than silently dropped -- see the packaging job's report
    # for the full breakdown; keeping them makes QuickCheck a real,
    # non-test dependency of the published library, which HTF is not.

executables:
  incremental-computations-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N2
    - -with-rtsopts=-A64m
    dependencies:
    - HTF
    - QuickCheck
    - binary
    - http-types
    - incremental-computations
    - optparse-applicative
    - process
    - wai
    - wai-extra
    - warp

benchmarks:
  incremental-computations-bench:
    main:                Main.hs
    source-dirs:
    - bench
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N2
    - -with-rtsopts=-A64m
    dependencies:
    - incremental-computations
    - process

tests:
  incremental-computations-test:
    main:                Spec.hs
    source-dirs:
    - test
    - src
    dependencies:
    - HTF
    - QuickCheck
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
