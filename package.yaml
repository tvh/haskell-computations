name:                incremental-computations
version:             0.2.0.0
github:              "tvh/haskell-computations"
license:             BSD3
author:              "medilyse GmbH, Freiburg, Germany (https://medilyse.org)"
maintainer:          "Timo von Holtz"
copyright:           "2010-2023 medilyse GmbH, 2026 Timo von Holtz"

extra-source-files:
  - README.md
  - CHANGELOG.md
  - Wehr_A-Software-Architecture-Based-on-Coarse-Grained-Self-Adjusting-Computations.pdf
  - hospital-config/**/*
  - webapp/**/*

synopsis:            A framework for coarse-grained self-adjusting (incremental) computations
category:            Control
description: |
  A library for coarse-grained self-adjusting computations: define
  computations as a DAG of typed, named steps wired to pluggable sources and
  sinks, and let the engine incrementally recompute only what changed when an
  input updates. State is tracked per definition in a columnar cache, so
  reruns after a small input change touch a small, targeted slice of the
  computation graph rather than the whole thing. Originally extracted from a
  commercial product built by medilyse GmbH; this fork rewrites the engine
  internals and narrows the public API down to what a library consumer
  actually needs. See the README for a worked example and the accompanying
  FUNARCH 2023 paper for the underlying architecture.

dependencies:
  - aeson >= 2.2 && < 2.3
  - async >= 2.2 && < 2.3
  - base >= 4.7 && < 5
  - base16-bytestring >= 1.0 && < 1.1
  - bytestring >= 0.12 && < 0.13
  - direct-sqlite >= 2.3 && < 2.4
  - containers >= 0.7 && < 0.8
  - directory >= 1.3 && < 1.4
  - exceptions >= 0.10 && < 0.11
  - filepath >= 1.5 && < 1.6
  - hashable >= 1.5 && < 1.6
  - large-hashable >= 0.1 && < 0.2
  - megaparsec >= 9.7 && < 9.8
  - monad-control >= 1.0 && < 1.1
  - mtl >= 2.3 && < 2.4
  - primitive >= 0.9 && < 0.10
  - psqueues >= 0.2 && < 0.3
  - random >= 1.2 && < 1.3
  - resourcet >= 1.3 && < 1.4
  - safe >= 0.3 && < 0.4
  - stm >= 2.5 && < 2.6
  - strict >= 0.5 && < 0.6
  - strict-list >= 0.1 && < 0.2
  - temporary >= 1.3 && < 1.4
  - text >= 2.1 && < 2.2
  - time >= 1.12 && < 1.13
  - transformers-base >= 0.4 && < 0.5
  - unix >= 2.8 && < 2.9
  - unordered-containers >= 0.2 && < 0.3
  - vector >= 0.13 && < 0.14
  # NOTE: cereal, cereal-text, extra, ghc-prim, and hslogger used to be
  # here. cereal/cereal-text are used only by
  # test/Control/Computations/CompEngine/Tests/TestCompEngine.hs (moved to
  # the tests: stanza); extra is used only by
  # app/Control/Computations/Demos/Hospital/Main.hs (moved to the
  # executables: stanza); ghc-prim and hslogger have no importer anywhere
  # in this repo (base already re-exports the GHC.* modules actually used
  # -- GHC.Generics, GHC.Stack, GHC.Conc, GHC.Exts, GHC.Stats -- none of
  # which require ghc-prim as a direct dependency; no module imports
  # System.Log.*) and were dropped entirely.

flags:
  werror:
    description: >
      Turn on -Werror so warnings fail the build. Off by default so this
      package builds cleanly as a dependency on GHC versions newer than the
      one it was developed against (a new warning must never break a
      downstream consumer's build). Enabled by this repo's own dev workflow
      and CI -- see the README's Development section for the exact command.
    manual: true
    default: false

ghc-options:
  - -O2
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wno-name-shadowing
  - -Wpartial-fields
  - -Wredundant-constraints

when:
  - condition: flag(werror)
    ghc-options: -Werror

default-extensions:
  - BangPatterns
  - DeriveDataTypeable
  - DeriveFoldable
  - DeriveFunctor
  - DeriveGeneric
  - DeriveTraversable
  - DerivingStrategies
  - DoAndIfThenElse
  - EmptyDataDecls
  - FlexibleContexts
  - GADTs
  - GeneralizedNewtypeDeriving
  - LambdaCase
  - OverloadedStrings
  - ScopedTypeVariables
  - StandaloneDeriving
  - StrictData
  - TypeApplications
  - TypeOperators
  - ViewPatterns

library:
  source-dirs: src
  # The public API is deliberately narrow: the facade, the flow-source/sink
  # classes, the shipped flow implementations, and the small user-facing
  # types that appear in their signatures (Fail/Option, Hash128, TimeSpan,
  # Clock, ...). Everything a consumer needs to define a comp and wire a
  # flow in should be reachable from this list; everything else -- the
  # columnar state layer (CompEngine/Utils/*), the engine internals
  # (CompEngine/{Impl,SimpleStateIf,Types,...}), and the Utils/* modules
  # that never surface in an exposed signature -- is other-modules and can
  # change without a major version bump. See exposed-modules below for the
  # per-module reasoning; anything not listed there is implicitly
  # other-modules (hpack default), listed explicitly for clarity.
  exposed-modules:
    - Control.Computations.CompEngine
    # ^ the facade: re-exports CacheBehaviors, CompDef, CompEval, CompFlow,
    # CompFlowRegistry, CompSink, CompSrc, Core, Driver, Run, Types (minus
    # CompM internals), and PaqPriority. Those ten CompEngine/* modules and
    # PriorityAgingQueue stay other-modules -- this facade is their only
    # sanctioned entry point, verified by grepping app/ and bench/ for any
    # direct import of them (there is exactly one, app/.../SqliteSrc.hs's
    # CompSrc import, rerouted through this facade rather than exposing
    # CompSrc itself).
    - Control.Computations.FlowImpls.CompLogging
    - Control.Computations.FlowImpls.FileSink
    - Control.Computations.FlowImpls.FileSrc
    - Control.Computations.FlowImpls.HashMapFlow
    - Control.Computations.FlowImpls.IOSink
    - Control.Computations.FlowImpls.TimeSrc
    # ^ the shipped sources/sinks users wire into a CompFlowRegistry.
    - Control.Computations.Utils.TimeSpan
    # ^ CompSrc/driver configs take TimeSpan (poll intervals, run limits).
    - Control.Computations.Utils.Fail
    - Control.Computations.Utils.Types
    # ^ Fail/Ok are in the CompSrc/CompSink class signatures (compSrcExecute
    # etc. return `Fail a`); Option is equally load-bearing --
    # CompSink.compSinkListExistingOutputs returns `Option (IO ...)`,
    # Run.RunSettings' rs_maxRunIterations field and Driver's
    # waitForRunAtLeast/waitForFullSettle are `Option`-typed, and
    # CompEngine.Types' CompCacheValue/CompDepVer fields are `Option`-typed
    # too. Utils.Types re-exports all of Utils.Fail (`module F`), so
    # exposing both together (rather than just Fail, as originally
    # suggested) is what makes Option actually reachable -- Utils.Fail
    # alone was not enough. TypeId is defined here too but never escapes an
    # opaque exported type (CompSrcId/CompSinkId hide their csi_type
    # field), so it doesn't independently force this decision -- Option
    # does.
    - Control.Computations.Utils.Hash
    # ^ CompEngine.Types' CompCacheMeta(..)/ccv_largeHash expose Hash128
    # directly, so a user constructing/inspecting a cache value needs this.
    - Control.Computations.Utils.Logging
    # ^ the engine and every FlowImpl log through this; a consumer needs
    # setupLogging/setLogLevel to control verbosity. Confirmed load-bearing,
    # not just demo convenience: every demo and the benchmark call it.
    - Control.Computations.Utils.Clock
    # ^ forced by the shipped FlowImpls' own signatures, not just demo use:
    # FileSrcConfig's fcsc_clock field and TimeSrc's initTimeSrc/withTimeSrc
    # both take a `Clock` argument directly, so a caller needs `realClock`
    # (or to build their own) to use FileSrc/TimeSrc at all.
    - Control.Computations.Utils.IOUtils
    # ^ likewise forced: FileSrc's DirEntry(..) has a `FileType` field and
    # FileKey(..) wraps a `CanonPath`, both defined here.
    - Control.Computations.Utils.TimeUtils
    # ^ likewise forced: TimeSrc's compGetTime takes a `TimeIntervalType`.
    # Control.Computations.FlowImpls.FileStoreSink and its supporting
    # Control.Computations.Utils.{Dispatcher,SqliteUtils,FileStore.*} used to
    # be exposed here too, but only because the Hospital demo imported them
    # directly -- no shipped FlowImpls signature required them. That demo-only
    # cluster has moved to Control.Computations.Demos.{FlowImpls,Utils}.* under
    # app/, so the library no longer needs to widen its API for it.
  dependencies:
    - QuickCheck >= 2.15 && < 2.16
    # ^ Not test-only: a handful of library types (TimeSpan, DataSize,
    # MultiMap, PriorityAgingQueue and its satellite types) carry an
    # `Arbitrary` instance defined alongside the type itself rather than in
    # a test module. TimeSpan's is exercised by test/TimeSpanTest.hs's
    # prop_timeSpanP; DataSize/MultiMap/PriorityAgingQueue's are not used by
    # any test in this repo -- they look like downstream convenience
    # instances (so a library consumer can `arbitrary` these types in their
    # own QuickCheck properties without writing the instance themselves).
    # Flagged rather than silently dropped -- see the packaging job's report
    # for the full breakdown; keeping them makes QuickCheck a real,
    # non-test dependency of the published library, which HTF is not.

executables:
  incremental-computations-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N2
    - -with-rtsopts=-A64m
    dependencies:
    - HTF >= 0.15 && < 0.16
    - QuickCheck
    - binary >= 0.8 && < 0.9
    - extra >= 1.8 && < 1.9
    - http-types >= 0.12 && < 0.13
    - incremental-computations
    - optparse-applicative >= 0.18 && < 0.19
    - process >= 1.6 && < 1.7
    - wai >= 3.2 && < 3.3
    - wai-extra >= 3.1 && < 3.2
    - warp >= 3.4 && < 3.5

benchmarks:
  incremental-computations-bench:
    main:                Main.hs
    source-dirs:
    - bench
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N2
    - -with-rtsopts=-A64m
    dependencies:
    - incremental-computations
    - process

tests:
  incremental-computations-test:
    main:                Spec.hs
    source-dirs:
    - test
    - src
    dependencies:
    - HTF
    - QuickCheck
    - cereal
    - cereal-text
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
